
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.
        columns:
          - name: cod_localidade
            description: Chave primária da tabela localidades.
            data_tests:
              - unique
              - not_null
              
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic.
        columns:
          - name: cod_cliente
            description: Chave primária da tabela clientes.
            data_tests:
              - unique
              - not_null

      - name: agencias
        description: Tabela fonte de agencias.
        columns:
          - name: cod_agencia
            description: Chave primária da tabela agencias.
            data_tests:
              - unique
              - not_null

      - name: colaboradores
        description: Tabela fonte de colaboradores.
        columns:
          - name: cod_colaborador
            description: Chave primária da tabela colaboradores.
            data_tests:
              - unique
              - not_null

      - name: colaborador_agencia
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - cod_colaborador
                  - cod_agencia

      - name: contas
        description: Tabela fonte de contas bancárias dos clientes.
        columns:
          - name: num_conta
            description: Chave primária da tabela contas.
            data_tests:
              - unique
              - not_null

      - name: propostas_credito
        description: Tabela fonte com as propostas de crédito solicitadas pelos clientes.
        columns:
          - name: cod_proposta
            description: Chave primária da tabela propostas_credito.
            data_tests:
              - unique
              - not_null

      - name: transacoes
        description: Tabela fato bruta contendo todas as movimentações financeiras.
        columns:
          - name: cod_transacao
            description: Chave primária da tabela transacoes.
            data_tests:
              - unique
              - not_null